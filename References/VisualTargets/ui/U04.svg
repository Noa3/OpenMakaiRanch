<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Workplace"><title>Workplace — UI layout draft, not game render</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0e201f"/><text x="48" y="49" font-size="20" fill="#c5d3cb" font-weight="600">OPEN MAKAI RANCH  /  VISUAL TARGET ATLAS</text><text x="48" y="113" font-size="44" fill="#f5f2e9" font-weight="600">Workplace</text><text x="1552" y="45" font-size="20" fill="#f5f2e9" font-weight="400"></text><text x="48" y="857" font-size="20" fill="#efd19b" font-weight="400">U04  /  LAYOUT DRAFT • NOT IN-ENGINE • SAMPLE COPY / VALUES</text><rect x="48" y="156" width="690" height="650" rx="14" fill="#466456"/><path d="M48,598.0 Q220.5,344.5 406.8,585.0 T738,494.0 L738,806H48Z" fill="#314f40"/><path d="M220.5,806Q455.09999999999997,611.0 393.0,494.0" stroke="#b7b79a" fill="none" stroke-width="16"/><rect x="68" y="176" width="650" height="48" rx="8" fill="#152b2a"/><text x="86" y="207" font-size="21" fill="#c5d3cb" font-weight="400">ADDRESSED PLACE REMAINS VISIBLE</text><rect x="770" y="156" width="782" height="650" rx="14" fill="#152b2a"/><text x="794" y="198" font-size="28" fill="#f5f2e9" font-weight="600">Kitchen</text><text x="794" y="234" font-size="22" fill="#c5d3cb" font-weight="400">Local interaction • no remote ranch-wide commands</text><rect x="798" y="258" width="228" height="56" rx="10" fill="#efd19b" stroke="#efd19b" stroke-width="2"/><text x="818" y="294" font-size="24" fill="#0e201f" font-weight="600">Overview</text><rect x="1042" y="258" width="228" height="56" rx="10" fill="#213e39"/><text x="1062" y="294" font-size="24" fill="#f5f2e9" font-weight="600">Team</text><rect x="1286" y="258" width="228" height="56" rx="10" fill="#213e39"/><text x="1306" y="294" font-size="24" fill="#f5f2e9" font-weight="600">Equipment</text><text x="802" y="383" font-size="30" fill="#f5f2e9" font-weight="600">Current situation</text><text x="802" y="426" font-size="24" fill="#c5d3cb" font-weight="400">One relevant status and one next action.</text><text x="802" y="460" font-size="24" fill="#c5d3cb" font-weight="400">Detailed output and costs are available on</text><text x="802" y="494" font-size="24" fill="#c5d3cb" font-weight="400">demand.</text><rect x="800" y="520" width="716" height="125" rx="14" fill="#213e39"/><text x="824" y="562" font-size="26" fill="#efd19b" font-weight="400">Before → After</text><text x="824" y="603" font-size="23" fill="#f5f2e9" font-weight="400">Quote, upkeep, wallet and availability</text><rect x="802" y="704" width="460" height="56" rx="10" fill="#efd19b" stroke="#efd19b" stroke-width="2"/><text x="822" y="740" font-size="24" fill="#0e201f" font-weight="600">Review upgrade</text><rect x="1278" y="704" width="234" height="56" rx="10" fill="#213e39"/><text x="1298" y="740" font-size="24" fill="#f5f2e9" font-weight="600">Back</text></g></svg>
