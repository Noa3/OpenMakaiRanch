<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Daily report"><title>Daily report — UI layout draft, not game render</title><g font-family="DejaVu Sans, sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#0e201f"/><text x="48" y="49" font-size="20" fill="#c5d3cb" font-weight="600">OPEN MAKAI RANCH  /  VISUAL TARGET ATLAS</text><text x="48" y="113" font-size="44" fill="#f5f2e9" font-weight="600">Daily report</text><text x="1552" y="45" font-size="20" fill="#f5f2e9" font-weight="400"></text><text x="48" y="857" font-size="20" fill="#efd19b" font-weight="400">U17  /  LAYOUT DRAFT • NOT IN-ENGINE • SAMPLE COPY / VALUES</text><rect x="48" y="156" width="1504" height="146" rx="14" fill="#152b2a"/><text x="72" y="198" font-size="28" fill="#f5f2e9" font-weight="600">Day complete</text><text x="72" y="234" font-size="22" fill="#c5d3cb" font-weight="400">Committed results — not a forecast and never a second payment</text><rect x="48" y="330" width="484" height="160" rx="14" fill="#152b2a"/><text x="72" y="372" font-size="28" fill="#f5f2e9" font-weight="600">Income</text><text x="74" y="441" font-size="29" fill="#efd19b" font-weight="400">Recorded income</text><rect x="558" y="330" width="484" height="160" rx="14" fill="#152b2a"/><text x="582" y="372" font-size="28" fill="#f5f2e9" font-weight="600">Costs</text><text x="584" y="441" font-size="29" fill="#efd19b" font-weight="400">Recorded costs</text><rect x="1068" y="330" width="484" height="160" rx="14" fill="#152b2a"/><text x="1092" y="372" font-size="28" fill="#f5f2e9" font-weight="600">Balance</text><text x="1094" y="441" font-size="29" fill="#efd19b" font-weight="400">Reconciled net</text><rect x="48" y="518" width="992" height="286" rx="14" fill="#152b2a"/><text x="72" y="560" font-size="28" fill="#f5f2e9" font-weight="600">Tomorrow</text><text x="72" y="596" font-size="22" fill="#c5d3cb" font-weight="400">Resident condition • completed work • one next step</text><text x="76" y="634" font-size="24" fill="#c5d3cb" font-weight="400">Show the most important change first. Expand the</text><text x="76" y="668" font-size="24" fill="#c5d3cb" font-weight="400">existing ledger for details. No fabricated positive</text><text x="76" y="702" font-size="24" fill="#c5d3cb" font-weight="400">result.</text><rect x="1070" y="704" width="482" height="56" rx="10" fill="#efd19b" stroke="#efd19b" stroke-width="2"/><text x="1090" y="740" font-size="24" fill="#0e201f" font-weight="600">Return to ranch</text></g></svg>
