name: Apply reviewed locale navigation repair
on:
  push:
    branches: [feature/world-stations-and-interiors-20260911]
    paths: [.github/workflows/apply-locale-navigation-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/world-stations-and-interiors-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-stations-and-interiors-20260911
      - name: Apply exact source edits and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          branch = 'feature/world-stations-and-interiors-20260911'
          if subprocess.check_output(['git','branch','--show-current'],text=True).strip() != branch:
              raise SystemExit('Wrong branch')
          names = {
            'OpenMakaiRanchGame/src/App/GameRoot.cs':'64193d4f3a67ea82ddb6e0941bbdcc89127de47a',
            'OpenMakaiRanchGame/src/World/PauseMenuController.cs':'9fbfe0dcc808a7bc6dae0d7af8e51ac2af721f97',
            'OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.Localization.cs':'d4182f49eb4533bf9f44c3995f8d20268e541ee0',
          }
          texts = {}
          for name, expected in names.items():
              raw = Path(name).read_bytes()
              if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() != expected:
                  raise SystemExit('Source changed: '+name)
              texts[name] = raw.decode('utf-8')
          def edit(name, old, new):
              name = 'OpenMakaiRanchGame/src/' + name
              if texts[name].count(old) != 1: raise SystemExit('Ambiguous edit: '+name)
              texts[name] = texts[name].replace(old,new)
          edit('App/GameRoot.cs',
               '\t\tState.Settings.Locale = normalizedLocale;\n\t\tApplyLocale();\n\t\tPersistAndSyncFeedbackSettings();',
               '\t\tState.Settings.Locale = normalizedLocale;\n\t\tApplyLocale();\n\t\t// A language change must not reapply window mode, resolution, audio or input settings.\n\t\tSettingsStorage.Save(State.Settings);')
          edit('World/PauseMenuController.cs',
               '        if (!Visible || (!_worldShortcutsAllowed && screenId is not ("options" or "settings" or "saveload"))) return;\n        Close();',
               '''        var utility = screenId is "options" or "settings" or "saveload";
                  // A physical board/corner may request the read-only place guide without
                  // re-enabling global management shortcuts or callbacks from hidden panels.
                  var physicalPlanning = screenId == "schedule"
                      && (IsRanchCornerOpen || (_physicalBoardOrigin && IsCommunityBoardOpen));
                  if (!Visible || (!_worldShortcutsAllowed && !utility && !physicalPlanning)) return;
                  Close();''')
          edit('Tests/UiLayoutAcceptance.Localization.cs',
               '            var culture = CultureInfo.CurrentCulture;\n',
               '            var culture = CultureInfo.CurrentCulture;\n            var windowSize = GetWindow().Size;\n            var windowMode = GetWindow().Mode;\n')
          edit('Tests/UiLayoutAcceptance.Localization.cs',
               '            Check(LocaleCatalog.T("world.test.missing", "English fallback") == "English fallback",',
               '''            Check(GetWindow().Size == windowSize && GetWindow().Mode == windowMode,
                          "locale: selecting a language leaves the actual window size and display mode unchanged");
                      Check(LocaleCatalog.T("world.test.missing", "English fallback") == "English fallback",''')
          edit('Tests/UiLayoutAcceptance.Localization.cs',
               '''        void KeyInPopup(Key key)
                  {
                      popup.PushInput(new InputEventKey { Keycode = key, PhysicalKeycode = key, Pressed = true }, true);
                      popup.PushInput(new InputEventKey { Keycode = key, PhysicalKeycode = key, Pressed = false }, true);
                  }
                  KeyInPopup(Key.Home);
                  for (var step = 0; step < index; step++) KeyInPopup(Key.Down);
                  KeyInPopup(Key.Enter);''',
               '''        // Send input through the owning window so its embedded-popup routing runs.
                  // Calling Viewport.PushInput on PopupMenu directly bypasses WindowInput.
                  await Stroke(Key.Home);
                  for (var step = 0; step < index; step++) await Stroke(Key.Down);
                  await Stroke(Key.Enter);''')
          edit('Tests/UiLayoutAcceptance.Localization.cs',
               '$"locale: popup keyboard navigation selects {locale} through the real picker callback"',
               '$"locale: popup keyboard navigation selects {locale} through the real picker callback (catalog={LocaleCatalog.CurrentLocale}, saved={GameRoot.Instance.State.Settings.Locale})"')
          # Keep packed-scene owners alive for the synthetic suite's repeated instantiate/free
          # cycles. This scope is smoke-only; it does not cache or collect during normal gameplay.
          edit('App/GameRoot.cs',
               '\tprivate async void RunSmokeTestsAndExit()\n\t{\n\t\tvar result = SmokeTestRunner.Run();',
               '''\tprivate async void RunSmokeTestsAndExit()
          \t{
          \t\tvar retainedScenes = new[]
          \t\t{
          \t\t\tGD.Load<PackedScene>("res://scenes/MainMenu.tscn"),
          \t\t\tGD.Load<PackedScene>("res://scenes/Game.tscn"),
          \t\t\tGD.Load<PackedScene>("res://scenes/CharacterCreationScreen.tscn"),
          \t\t\tGD.Load<PackedScene>("res://scenes/dev/RanchGreybox.tscn"),
          \t\t\tGD.Load<PackedScene>("res://scenes/WorldGame.tscn")
          \t\t};
          \t\tvar result = SmokeTestRunner.Run();''')
          edit('App/GameRoot.cs',
               '\t\tfor (var i = 0; i < 4; i++) await ToSignal(GetTree(), SceneTree.SignalName.ProcessFrame);\n\t\tGC.Collect();',
               '\t\tfor (var i = 0; i < 4; i++) await ToSignal(GetTree(), SceneTree.SignalName.ProcessFrame);\n\t\tArray.Clear(retainedScenes);\n\t\tGC.Collect();')
          for name, text in texts.items(): Path(name).write_text(text,encoding='utf-8')
          helper = '.github/workflows/apply-locale-navigation-fix.yml'
          Path(helper).unlink()
          subprocess.run(['git','add','--',*names,helper],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','fix(ui): isolate language changes and restore physical planning routes'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
