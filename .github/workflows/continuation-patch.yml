name: Apply guarded opening regression hook
on:
  push:
    branches: [fix/intro-navigation-and-presentation-20260911]
    paths: [Tools/Godot/continuation_patch.py, .github/workflows/continuation-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/intro-navigation-and-presentation-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intro-navigation-and-presentation-20260911
      - name: Apply only the exact reviewed source hook, remove this helper and fast-forward the work branch
        run: |
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python Tools/Godot/continuation_patch.py
