name: Apply reviewed UI layout patch
on:
  push:
    branches: [ 'playability/ranch-quiet-corner-20260910' ]
    paths: [ '.github/workflows/apply-ui-layout-patch.yml' ]
jobs:
  apply:
    if: github.ref == 'refs/heads/playability/ranch-quiet-corner-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact reviewed source edits
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          changed = []
          def patch(name, expected, replacements):
              p = pathlib.Path(name)
              raw = p.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if blob != expected:
                  raise RuntimeError('Concurrent source change; review instead of overwrite: ' + name)
              text = raw.decode('utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError('Expected one exact source anchor: ' + name + ' ' + repr(old))
                  text = text.replace(old, new, 1)
              p.write_bytes(text.encode('utf-8'))
              changed.append(name)
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.cs', 'cd82d1c7f54ad8dcb31081c37ccfd74a5d84f284', [
              ('private HBoxContainer _topBarRow1', 'private HFlowContainer _topBarRow1'),
              ('private HBoxContainer _topBarRow2', 'private HFlowContainer _topBarRow2'),
              ('GetNodeOrNull<HBoxContainer>("Margin/RootPanel/Root/TopBar/TopBarRow1")', 'GetNodeOrNull<HFlowContainer>("Margin/RootPanel/Root/TopBar/TopBarRow1")'),
              ('GetNodeOrNull<HBoxContainer>("Margin/RootPanel/Root/TopBar/TopBarRow2")', 'GetNodeOrNull<HFlowContainer>("Margin/RootPanel/Root/TopBar/TopBarRow2")'),
              ('_topBarRow1.AddThemeConstantOverride("separation", compact ? 4 : 8);', '_topBarRow1.AddThemeConstantOverride("h_separation", compact ? 4 : 8);\n\t\t_topBarRow1.AddThemeConstantOverride("v_separation", 4);'),
              ('_topBarRow2.AddThemeConstantOverride("separation", compact ? 4 : 8);', '_topBarRow2.AddThemeConstantOverride("h_separation", compact ? 4 : 8);\n\t\t_topBarRow2.AddThemeConstantOverride("v_separation", 4);'),
              ('new Vector2(compact ? 128 : 140, compact ? 26 : 30)', 'new Vector2(compact ? 128 : 140, 34)'),
              ('new Vector2(compact ? 58 : 64, compact ? 26 : 30)', 'new Vector2(compact ? 58 : 64, 34)')])
          patch('OpenMakaiRanchGame/scenes/Game.tscn', '58f3ee3557c02e9ded8f7a13cddfc30e8fb0ede7', [
              ('[node name="TopBarRow1" type="HBoxContainer"', '[node name="TopBarRow1" type="HFlowContainer"'),
              ('[node name="TopBarRow2" type="HBoxContainer"', '[node name="TopBarRow2" type="HFlowContainer"')])
          patch('OpenMakaiRanchGame/src/App/MainMenuController.Controller.cs', '9154ddac47a738a9e1583c12fa2b3d6223b0e4a1', [
              ('    public override void _Process(double delta)\n    {', '    public override void _Process(double delta)\n    {\n        RefreshMenuLayout();')])
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.Styling.cs', 'ae018058d1069f351a1eff8f7316f6745ec11ed1', [
              ('label.AutowrapMode = TextServer.AutowrapMode.WordSmart;\n        label.TextOverrunBehavior = TextServer.OverrunBehavior.TrimEllipsis;',
               'label.AutowrapMode = TextServer.AutowrapMode.WordSmart;\n        // Wrapped text must contribute its natural height to its container.\n        label.TextOverrunBehavior = TextServer.OverrunBehavior.NoTrimming;')])
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.InputOptions.cs', 'f5b0ab4cfad383f65cc9a002c0e4983370bb4e2d', [
              ('!GodotObject.IsInstanceValid(button)\n            || !button.IsInsideTree() || !_content.IsAncestorOf(button)', '!IsLiveBindingControl(button)'),
              ('!GodotObject.IsInstanceValid(_bindingCaptureButton)\n            || !_bindingCaptureButton!.IsInsideTree() || !_content.IsAncestorOf(_bindingCaptureButton)', '!IsLiveBindingControl(_bindingCaptureButton)'),
              ('if (string.IsNullOrEmpty(_bindingCaptureAction) || Time.GetTicksMsec() < _captureArmedAt)', 'if (string.IsNullOrEmpty(_bindingCaptureAction))'),
              ('        if (_bindingCaptureDevice == "keyboard" && @event is InputEventKey key', '        if (TryCancelBindingInput(@event)) return;\n        if (Time.GetTicksMsec() < _captureArmedAt)\n        {\n            if (@event.IsPressed()) GetViewport().SetInputAsHandled();\n            return;\n        }\n\n        if (_bindingCaptureDevice == "keyboard" && @event is InputEventKey key'),
              ('    private void RebuildInputOptionsExtension(string message)\n    {', '    private void RebuildInputOptionsExtension(string message)\n    {\n        CancelBindingCapture("Binding cancelled.");'),
              ('            existing.Name = ControlsExtensionName + "_Old";\n            existing.QueueFree();', '            _content.RemoveChild(existing);\n            existing.QueueFree();')])
          patch('OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.cs', '941108a8f49ebc07ba1dd2af064e2be68f58853b', [
              ('            await Capture("main-menu-1280x720");', '            await CheckStartupLayouts(menu);'),
              ('            await Capture("character-creation-1280x720");', '            await CheckCreationLayouts(shell);'),
              ('                GetTree().Root.Size = size;\n                await Frames(10);', '                await Resize(size);'),
              ('            Check(game.Economy.Gold == gold', '            await CheckGamepadMenus(world);\n            await CheckUiScale(world);\n            Check(game.Economy.Gold == gold'),
              ('        var point = control.GetGlobalRect().GetCenter();', '        var point = control.GetGlobalRect().GetCenter();\n        GetViewport().NotifyMouseEntered();'),
              ('            await Frames(3);\n            // Keep this opt-in observer', '            ProcessMode = ProcessModeEnum.Always;\n            await Frames(3);\n            // Keep this opt-in observer')])
          helper = pathlib.Path('.github/workflows/apply-ui-layout-patch.yml')
          helper.unlink()
          changed.append(str(helper))
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *changed], check=True)
      - name: Commit explicit paths without force and remove this one-use helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): reflow small-window menus and preserve binding cancellation'
          git push origin HEAD:refs/heads/playability/ranch-quiet-corner-20260910
