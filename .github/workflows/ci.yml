name: Godot 4.7 Mono CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'integration/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-import-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Godot .NET project
        run: dotnet restore OpenMakaiRanchGame/OpenMakaiRanchGame.csproj --ignore-failed-sources

      - name: Verify C# 12 language contract
        run: |
          $projects = @(
            "OpenMakaiRanchGame/OpenMakaiRanchGame.csproj",
            "OpenMakaiRanchGame/OpenMakaiRanch.csproj"
          )
          foreach ($project in $projects) {
            $output = @(& dotnet msbuild $project -nologo -getProperty:LangVersion)
            if ($LASTEXITCODE -ne 0 -or $output.Count -eq 0 -or $output[-1].Trim() -ne "12.0") {
              throw "Expected effective LangVersion 12.0 for $project; got $output"
            }
            Write-Output "C# 12 verified: $project"
          }
          $denial = & dotnet msbuild $projects[0] -nologo -target:RequireCSharp12 -p:LangVersion=preview 2>&1
          $denialExit = $LASTEXITCODE
          if ($denialExit -eq 0 -or "$denial" -notmatch "requires C# 12") {
            throw "Negative control failed: a preview-language override was not rejected by the language guard. $denial"
          }
          Write-Output "C# 12 negative control passed: preview override was rejected."
          exit 0

      - name: Compile Godot .NET project
        run: dotnet build OpenMakaiRanchGame/OpenMakaiRanchGame.csproj --configuration Debug --no-restore -p:RunAnalyzers=true

      - name: Run launcher regression tests
        run: python -m unittest discover -s Tools/Godot -p "test_*.py"

      - name: Install verified Godot 4.7.2 Mono
        run: |
          $version = "4.7.2"
          $archive = "Godot_v$version-stable_mono_win64.zip"
          $url = "https://github.com/godotengine/godot-builds/releases/download/$version-stable/$archive"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          $installDir = Join-Path $env:RUNNER_TEMP "godot-$version-mono"
          Invoke-WebRequest -Uri $url -OutFile $zip

          $expectedSha256 = "a2a48473a7414c5f19fab690518caebb738c09ef9601f6bd2388676a7f53b3c0"
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Godot archive checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -Path $zip -DestinationPath $installDir -Force
          $godotExe = Get-ChildItem -Path $installDir -Recurse -File -Filter "Godot_v$version-stable_mono_win64.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $godotExe) {
            throw "Godot $version Mono engine executable was not found after extraction."
          }

          "GODOT_BIN=$godotExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $godotExe --version

      - name: Verify launcher resolves Godot 4.7 Mono
        run: python Tools/Godot/launch.py --mode check

      - name: Import project with Godot 4.7 Mono
        run: python Tools/Godot/launch.py --mode import --timeout 300

      - name: Run isolated Godot smoke suite
        run: python Tools/Godot/launch.py --mode smoke --timeout 300

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7-verification
          if-no-files-found: ignore
          path: |
            .artifacts/godot/**
            OpenMakaiRanchGame/bin/Debug/**
