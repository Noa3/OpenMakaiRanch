name: Apply reviewed day-loop corrections
on:
  push:
    branches: ['playability/ranch-quiet-corner-20260910']
    paths: ['.github/workflows/apply-day-loop-patch.yml']
jobs:
  apply:
    if: github.ref == 'refs/heads/playability/ranch-quiet-corner-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact source replacements and remove this one-use helper
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          changed = []
          def read(name, expected):
              p = pathlib.Path(name)
              raw = p.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if sha != expected: raise RuntimeError('Concurrent source change; review before overwrite: ' + name)
              return raw.decode('utf-8')
          def replace(text, old, new):
              if text.count(old) != 1: raise RuntimeError('Expected exactly one source anchor: ' + repr(old[:90]))
              return text.replace(old, new, 1)
          def write(name, text):
              pathlib.Path(name).write_bytes(text.encode('utf-8'))
              changed.append(name)

          name = 'OpenMakaiRanchGame/src/Gameplay/DailySettlementService.cs'
          t = read(name, 'e2eaeb5134f5b8fc557e4624d61920cd72365df5')
          t = replace(t, '        var income = 0;', '        var income = 0;\n        var ledger = new DailyGoldLedger(_economy.Gold);\n        // Clear once per day, not between night training and ordinary growth.\n        foreach (var character in _state.Roster.Characters) character.HasGrownToday = false;')
          t = replace(t, '        _economy.ApplySettlement(income, expenses);', '        _economy.ApplySettlement(income, expenses);\n        ledger.RecordWorkAndUpkeep(income, expenses, _economy.Gold);')
          t = replace(t, '        int milkRevenue = 0;', '        var beforeShipping = _economy.Gold;')
          t = replace(t, '            milkRevenue += _milkEconomy.ShipMilk(character.Id);', '            _milkEconomy.ShipMilk(character.Id);')
          t = replace(t, '        if (milkRevenue > 0)', '        var milkRevenue = ledger.RecordChange(beforeShipping, _economy.Gold);\n        if (milkRevenue > 0)')
          t = replace(t, '        _events.GenerateEvents(report);', '        var beforeEvents = _economy.Gold;\n        _events.GenerateEvents(report);\n        ledger.RecordChange(beforeEvents, _economy.Gold);')
          t = replace(t, '        _milestones.CheckAfterSettlement(report);', '        var beforeMilestones = _economy.Gold;\n        _milestones.CheckAfterSettlement(report);\n        ledger.RecordChange(beforeMilestones, _economy.Gold);\n        ledger.Complete(report, _state.Economy);')
          t = replace(t, '                // Training at night: everyone gets a small stat gain and a day off fatigue', '                // One extra ranch-wide pass, independent of resident count.')
          t = replace(t, '                    // Static workload: night training leans on stamina instead\n                    _growth.ApplyGrowth(report);', '')
          t = replace(t, '                report.Lines.Add("Night training: everyone practiced. Effort improves growth.");', '                _growth.ApplyGrowth(report);\n                report.Lines.Add("Night training: one extra growth pass for working residents; bond +1 and morale +2.");')
          t = replace(t, '                // Administrative work cuts facility expenses this day', '                // Reduces workload, not upkeep or gold costs.')
          write(name,t)

          name = 'OpenMakaiRanchGame/src/Gameplay/LifecycleServices.cs'
          t = read(name, '09be1c166b4df7af5c0458550d3f24ec2eb7ef6d')
          t = replace(t, '            if (gold > 0) _economy.AddGold(gold);', '            var beforeGold = _economy.Gold;\n            if (gold > 0) _economy.AddGold(gold);\n            gold = _economy.Gold - beforeGold; // Actual credit after wallet limits.')
          t = replace(t, '            character.HasGrownToday = false;', '            // DailySettlementService resets this once before both possible growth passes.')
          write(name,t)

          name = 'OpenMakaiRanchGame/src/Gameplay/ManagementServices.cs'
          t = read(name, 'bc79d20f65ebe6f775901d408f5a4859cc7f5596')
          old = '            _state.Milestones.CompletedIds.Add(milestone.Id);\n            _economy.AddGold(milestone.RewardGold);\n            _state.Economy.LastIncome += milestone.RewardGold;\n            report.Income += milestone.RewardGold;\n            report.NetGold += milestone.RewardGold;\n            report.Lines.Add($"Milestone unlocked: {milestone.DisplayName} (+{milestone.RewardGold} gold)." );'
          new = '            _state.Milestones.CompletedIds.Add(milestone.Id);\n            var beforeGold = _economy.Gold;\n            _economy.AddGold(milestone.RewardGold);\n            var credited = _economy.Gold - beforeGold;\n            _state.Economy.LastIncome = (int)Math.Clamp((long)_state.Economy.LastIncome + credited, int.MinValue, int.MaxValue);\n            report.Income = (int)Math.Clamp((long)report.Income + credited, int.MinValue, int.MaxValue);\n            report.NetGold = (int)Math.Clamp((long)report.NetGold + credited, int.MinValue, int.MaxValue);\n            report.Lines.Add($"Milestone unlocked: {milestone.DisplayName} (+{credited} gold credited)." );'
          write(name,replace(t,old,new))

          name = 'OpenMakaiRanchGame/src/App/GameRoot.cs'
          t = read(name, 'cf276f3818ecc45f4d4125cb9848fa0d2d2b611f')
          start = t.index('\tpublic void SetNightAction(')
          end = t.index('\tpublic int RechargePlayerManaFromStorage(', start)
          old = t[start:end]
          t = replace(t, old, '\tpublic void SetNightAction(string action) =>\n\t\tTrySelectNightAction(action, StateGeneration, State.Calendar.Day);\n\n\tpublic DailyReport EndDay() => SettleAndPublishDay();\n\n')
          t = replace(t, '\tpublic bool AdvanceTime()\n\t{\n\t\tif (_combatWorldTimeLocked)', '\tpublic bool AdvanceTime()\n\t{\n\t\tif (_settlingDay || _combatWorldTimeLocked\n\t\t\t|| (State.Calendar.Phase == DayPhase.Night && !HasNightPlan))')
          t = replace(t, 'if (State.Calendar.Phase == DayPhase.Night)\n\t\t{\n\t\t\tState.Calendar.NightAction = "rest";', 'if (State.Calendar.Phase == DayPhase.Night && !HasNightPlan)\n\t\t{\n\t\t\tState.Calendar.NightAction = "rest";')
          write(name,t)

          name = 'OpenMakaiRanchGame/src/Ui/UiShellController.cs'
          t = read(name, '61c159f07b2e9481fccb765c6fe60e1b9c880a0b')
          start = t.index('\t\tif (_game.State.Calendar.Phase == DayPhase.Night && !nowFullScreen')
          end = t.index('\t\tRestoreContentViewDeferred', start)
          t = replace(t, t[start:end], '\t\tif (_game.State.Calendar.Phase == DayPhase.Night && !nowFullScreen && screenId is not ("ranch" or "report" or "combat"))\n\t\t\tAddNightPlanningCard();\n')
          start = t.index('\t\t_endDayButton.Pressed +=')
          end = t.index('\n\n\t\tif (_menuButton',start)
          t = replace(t, t[start:end], '\t\t_endDayButton.Pressed += () => AdvanceFromManagement(\n\t\t\t_game.StateGeneration, _game.State.Calendar.Day, _game.State.Calendar.Phase);')
          t = replace(t, '\t\t\tbath.Pressed += () =>\n\t\t\t{\n\t\t\t\tvar result = _game.UsePlayerBath();', '\t\t\tvar bathGeneration = _game.StateGeneration;\n\t\t\tvar bathDay = _game.State.Calendar.Day;\n\t\t\tvar bathPhase = _game.State.Calendar.Phase;\n\t\t\tbath.Pressed += () =>\n\t\t\t{\n\t\t\t\tif (!IsLiveDayControl(bath, revision, bathGeneration, bathDay, bathPhase)) return;\n\t\t\t\tvar result = _game.UsePlayerBath();')
          write(name,t)

          name = 'OpenMakaiRanchGame/src/Ui/UiShellController.Screens.cs'
          t = read(name, '1e2f98dac7cd7ad493262644e436b027a78f607f')
          t = replace(t,'        AddRanchCommandDeck();','        if (_game.State.Calendar.Phase == DayPhase.Night) AddNightPlanningCard();\n        AddRanchCommandDeck();')
          start = t.index('        var advance = PrimaryButton(_game.State.Calendar.Phase')
          end = t.index('        AddFlowButton(actions, advance, 150);',start)
          t = replace(t,t[start:end],'        var advance = DayAdvanceButton();\n')
          t = replace(t, 'var milkSuffix = rpt.MilkRevenue > 0 ? $" | Milk: +{rpt.MilkRevenue}g" : string.Empty;', 'var milkSuffix = rpt.MilkRevenue > 0 ? $" | Shipments included: {rpt.MilkRevenue}g" : string.Empty;')
          write(name,t)

          name = 'OpenMakaiRanchGame/src/Tests/DaySettlementRegressionTests.cs'
          t = read(name,'f925cad08fbf22af697f5708dd1ed2dcdea15826')
          write(name,replace(t,'        CheckRootCommands(result);','        CheckRootCommands(result);\n        DayCommandRegressionTests.Run(result, data);'))

          name = 'OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.cs'
          t = read(name,'d7402fa537e264a70aaf3ef8994e2d37f1834d18')
          start = t.index('            ValidateIsolation();')
          end = t.index('\n        }\n        catch (Exception exception)',start)
          scenario = t[start:end] + '\n            await CheckNightLoop(world);'
          scenario = '\n'.join(line[4:] if line.startswith('    ') else line for line in scenario.splitlines())
          t = replace(t,t[start:end],'            await RunScenario();')
          t = replace(t,'            GetTree().Paused = false;\n            var passed','            GetTree().Paused = false;\n            if (!string.IsNullOrEmpty(_evidence))\n            {\n                try { await RetireAcceptanceWorld(); }\n                catch (Exception error) { Check(false, "acceptance teardown: " + error.Message); }\n            }\n            var passed')
          methods = '    private async Task RunScenario()\n    {\n' + scenario + '\n    }\n\n    private async Task RetireAcceptanceWorld()\n    {\n        // Test-only teardown: retire the temporary world before shutting down the C# bridge.\n        // No forced collection is added to ordinary gameplay.\n        if (GetTree().CurrentScene is { } scene && scene != this && GodotObject.IsInstanceValid(scene))\n            scene.QueueFree();\n        await Frames(4);\n        GC.Collect();\n        GC.WaitForPendingFinalizers();\n        await Frames(3);\n    }\n\n    private void ValidateIsolation()'
          write(name,replace(t,'    private void ValidateIsolation()',methods))

          helper = pathlib.Path('.github/workflows/apply-day-loop-patch.yml')
          helper.unlink()
          changed.append(str(helper))
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','add','--',*changed], check=True)
      - name: Commit only reviewed paths without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(gameplay): guard nightly decisions and reconcile settled daily outcomes'
          git push origin HEAD:refs/heads/playability/ranch-quiet-corner-20260910
