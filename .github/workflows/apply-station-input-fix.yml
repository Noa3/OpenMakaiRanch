name: Apply reviewed station input repair
on:
  push:
    branches: [feature/world-stations-and-interiors-20260911]
    paths: [.github/workflows/apply-station-input-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/world-stations-and-interiors-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-stations-and-interiors-20260911
      - name: Apply exact reviewed edits, remove this helper, and fast-forward only the work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          branch = 'feature/world-stations-and-interiors-20260911'
          if subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip() != branch:
              raise SystemExit('Refusing a different branch')
          paths = {
              'src/App/InputBindingService.cs': '5e79e01f1578237bc14f915099fcce3b6fd52582',
              'src/Tests/PlayabilityFrameTests.cs': 'a9e83e20439c950a1eb2f1ac2100b892629e5d6e',
              'src/Tests/UiLayoutAcceptance.Stations.cs': '8dabd1395f4368dcc2fa4c9b9738995bdb50e50f',
              'src/World/FirstDayFlowController.cs': '66e336dee5b74add600df58ac5715f7a91618334',
              'src/World/WorldInteractionAssistController.cs': '4f8d6999281f01b20f429890eefdbaeacc0d86c6',
          }
          source = {}
          for name, expected in paths.items():
              path = Path('OpenMakaiRanchGame') / name
              data = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Source changed: {path}; inspect before editing')
              source[name] = data.decode('utf-8')
          def replace(name, old, new):
              if source[name].count(old) != 1:
                  raise SystemExit(f'Expected one replacement in {name}')
              source[name] = source[name].replace(old, new)
          replace('src/App/InputBindingService.cs',
              '        if (!_loaded || forceReload)\n        {\n            _preferences = Load();\n            _loaded = true;\n        }',
              '        // Prompt reads must not erase held InputMap events every frame.\n        // Explicit binding edits below already apply their changed action.\n        if (_loaded && !forceReload) return;\n        _preferences = Load();\n        _loaded = true;')
          replace('src/World/WorldInteractionAssistController.cs',
              '        _label.Text = presentation.Label;\n        _label.TooltipText = $"Use {presentation.Label}.";\n        _actionButton.Text = $"[{interactBinding}]  Interact";',
              '        var inspectOnly = presentation.TargetNode is WorldStation { IsAvailable: false };\n        _label.Text = inspectOnly && !string.IsNullOrWhiteSpace(presentation.UnavailableReason)\n            ? $"{presentation.Label}  •  {presentation.UnavailableReason}" : presentation.Label;\n        _label.TooltipText = inspectOnly ? presentation.UnavailableReason : $"Use {presentation.Label}.";\n        _actionButton.Text = $"[{interactBinding}]  {(inspectOnly ? "Inspect" : "Interact")}";')
          replace('src/World/FirstDayFlowController.cs',
              'Good. Next visit the Dairy Barn workstation. Leaving Dairy Work completely unstaffed adds maintenance cost and hurts morale. Assign a resident there; merely opening the station never pays production.',
              'Next visit the Dairy Barn workstation. If the barn is unfinished, use Build there first; its price is shown before you pay. Then assign a different resident, leaving Pasture Work staffed. The building stays available on later days. Opening a workstation or assigning someone does not pay production early.')
          replace('src/World/FirstDayFlowController.cs',
              'Follow the Dairy Barn marker. Interact with its station and assign at least one resident.',
              'Follow the Dairy Barn marker. Open its workstation, build the barn if needed, then assign a different resident.')
          replace('src/Tests/PlayabilityFrameTests.cs',
              '            var dairyWorker = game.Roster.Characters.First(character => character.Id != pastureWorker).Id;',
              '''            // Follow the actual construction step with starting funds, not a fixture unlock.
                      if (!dairy.IsAvailable)
                      {
                          var beforeBuild = game.Economy.Gold;
                          var definition = game.Data.Facilities[dairy.RequiredFacilityId];
                          var buildCost = game.Ranch.FacilityUpgradeCost(definition, 0);
                          var build = PlayabilityRegressionTests.Buttons(world.StationPanel!).Single(button => button.Name == "FacilityUpgrade");
                          if (build.Disabled) throw new InvalidOperationException("Starting funds cannot afford the guided barn construction.");
                          build.EmitSignal(BaseButton.SignalName.Pressed);
                          await Frames(game, 3);
                          Check(result, dairy.IsAvailable && game.Economy.Gold == beforeBuild - buildCost,
                              "the first-day barn is built once at its listed price with real starting funds");
                      }
                      var dairyWorker = game.Roster.Characters.First(character => character.Id != pastureWorker).Id;''')
          replace('src/Tests/UiLayoutAcceptance.Stations.cs',
              '            Check(player.InputGate.WorldInputEnabled && player.ReadMovementInput().Y > 0,',
              '''            Input.FlushBufferedEvents();
                      var keyEvent = InputMap.ActionGetEvents("move_forward").OfType<InputEventKey>().First();
                      for (var i = 0; i < 10; i++) InputBindingService.GetCombinedLabel("interact");
                      Check(ReferenceEquals(keyEvent, InputMap.ActionGetEvents("move_forward").OfType<InputEventKey>().First())
                          && Input.IsActionPressed("move_forward"),
                          "input: reading live HUD bindings leaves the held movement event and pressed state intact");
                      Check(player.InputGate.WorldInputEnabled && player.ReadMovementInput().Y > 0,''')
          for name, text in source.items():
              (Path('OpenMakaiRanchGame') / name).write_text(text, encoding='utf-8')
          helper = '.github/workflows/apply-station-input-fix.yml'
          Path(helper).unlink()
          subprocess.run(['git', 'add', '--', *['OpenMakaiRanchGame/' + name for name in paths], helper], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix(playability): preserve held input and explain resource-backed barn construction'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          PY
