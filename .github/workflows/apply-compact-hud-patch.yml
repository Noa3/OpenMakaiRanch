name: Apply reviewed compact HUD patch
on:
  push:
    branches: ['playability/ranch-quiet-corner-20260910']
    paths: ['.github/workflows/apply-compact-hud-patch.yml']
jobs:
  apply:
    if: github.ref == 'refs/heads/playability/ranch-quiet-corner-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed edits only to unchanged source
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          changed = []
          def patch(name, expected, edits):
              p = pathlib.Path(name)
              raw = p.read_bytes()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if blob != expected:
                  raise RuntimeError('Concurrent source change; review instead of overwrite: ' + name)
              text = raw.decode('utf-8')
              for old, new in edits:
                  if text.count(old) != 1:
                      raise RuntimeError('Expected one exact reviewed source anchor: ' + name)
                  text = text.replace(old, new, 1)
              p.write_bytes(text.encode('utf-8'))
              changed.append(name)
          patch('OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.cs', 'f105289e8f679fbf9de5fea3fa5b3162e3463ee6', [
              ('                await Capture("options-top-" + tag);', '                shell.GetNode<Button>(shell.MenuButtonPath).GrabFocus();\n                scroll.ScrollVertical = 0;\n                await Frames(3);\n                await Capture("options-top-" + tag);'),
              ('                scroll.EnsureControlVisible(binding);', '                // FollowFocus owns this scroll; a second same-frame request sees stale geometry.'),
              ('        GetViewport().NotifyMouseEntered();\n', ''),
              ('            await CheckUiScale(world);', '            await CheckUiScale(world);\n            await CheckWorldLayouts(world);'),
          ])
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.InputOptions.cs', '4c507aeafcd28b4265a57e1640b94aa12d9e5f9c', [
              ('            Name = $"Keyboard_{descriptor.Action}",', '            Name = $"Keyboard_{descriptor.Action}",\n            ClipText = true,\n            TextOverrunBehavior = TextServer.OverrunBehavior.TrimEllipsis,'),
              ('            Name = $"Controller_{descriptor.Action}",', '            Name = $"Controller_{descriptor.Action}",\n            ClipText = true,\n            TextOverrunBehavior = TextServer.OverrunBehavior.TrimEllipsis,'),
          ])
          patch('OpenMakaiRanchGame/src/World/WorldHudController.cs', '632b3c817a3a3481ce11053188a689c6fe6773ce', [
              ('            _tutorialHelpButton.OffsetBottom = -18f - metrics.SafeBottom;\n        }\n    }', '            _tutorialHelpButton.OffsetBottom = -18f - metrics.SafeBottom;\n        }\n        WorldHudResponsiveLayout.Apply(this, metrics, ranch: true);\n    }'),
          ])
          patch('OpenMakaiRanchGame/src/World/TownHudController.cs', 'f694cf554903b2dc548f892ebfd2c9a8cb8fc083', [
              ('            _tutorialHelpButton.OffsetBottom = -18f - metrics.SafeBottom;\n        }\n    }', '            _tutorialHelpButton.OffsetBottom = -18f - metrics.SafeBottom;\n        }\n        WorldHudResponsiveLayout.Apply(this, metrics, ranch: false);\n    }'),
          ])
          patch('OpenMakaiRanchGame/src/World/WorldTutorialController.cs', '58346ac8cdc740f1ae8edfb215604c5a9ebc25e6', [
              ('private PanelContainer? _helpPanel;', 'private ScrollContainer? _helpPanel;'),
              ('_helpPanel = GetNodeOrNull<PanelContainer>("HelpPanel");', '_helpPanel = GetNodeOrNull<ScrollContainer>("HelpPanel");'),
              ('        _helpPanel.Visible = true;', '        WorldHudResponsiveLayout.PrepareHelp(_helpPanel, _visibleStepIndex >= 0 && _visibleStepIndex < Steps.Length\n            ? $"{Steps[_visibleStepIndex].Title}\\n{Steps[_visibleStepIndex].Body}\\n{Steps[_visibleStepIndex].KeyHint}" : string.Empty);\n        _helpPanel.Visible = true;\n        _helpPanel.GrabFocus();'),
              ('_hintCard.Visible = _worldGame?.IsManagementVisible != true;', '_hintCard.Visible = _worldGame?.IsManagementVisible != true\n            && GetViewport().GetVisibleRect().Size.Y >= 480;'),
          ])
          patch('OpenMakaiRanchGame/src/World/TownTutorialController.cs', '103e8d5a3f30ba512f788b3818978d0dfa24a019', [
              ('private PanelContainer? _helpPanel;', 'private ScrollContainer? _helpPanel;'),
              ('_helpPanel = GetNodeOrNull<PanelContainer>("HelpPanel");', '_helpPanel = GetNodeOrNull<ScrollContainer>("HelpPanel");'),
              ('        _helpPanel.Visible = true;', '        WorldHudResponsiveLayout.PrepareHelp(_helpPanel, _hintLabel?.Text ?? string.Empty);\n        _helpPanel.Visible = true;\n        _helpPanel.GrabFocus();'),
          ])
          patch('OpenMakaiRanchGame/scenes/dev/RanchGreybox.tscn', '4dc5ad110b27c76e6903762b90ee5eab5f58eacc', [
              ('[node name="HelpPanel" type="PanelContainer"', '[node name="HelpPanel" type="ScrollContainer"'),
          ])
          patch('OpenMakaiRanchGame/scenes/dev/TownGreybox.tscn', 'b92dd585fb8691421d6b15a2da248cb2f2df1627', [
              ('[node name="HelpPanel" type="PanelContainer"', '[node name="HelpPanel" type="ScrollContainer"'),
          ])
          patch('OpenMakaiRanchGame/src/World/WorldAlertPanelController.cs', '2de9cd7aa0192fd07e0d28760dfa4bcb3c50a1d0', [
              ('    private Label? _body;', '    private Label? _body;\n    private bool _compact;\n\n    public void SetCompact(bool compact)\n    {\n        if (_compact == compact) return;\n        _compact = compact;\n        Refresh();\n    }'),
              ('            _body.Text = string.Join("\\n", top.Select(alert =>', '            _body.MaxLinesVisible = _compact ? 2 : -1;\n            _body.TextOverrunBehavior = _compact ? TextServer.OverrunBehavior.TrimEllipsis : TextServer.OverrunBehavior.NoTrimming;\n            _body.Text = _compact ? top[0].Title + " (F1: details)" : string.Join("\\n", top.Select(alert =>'),
          ])
          patch('OpenMakaiRanchGame/src/World/WorldInteractionAssistController.cs', '98441da1b9b30760d6c3e2ba3fe63bb1fd8fe665', [
              ('        var row = new HBoxContainer { Name = "Row" };', '        var row = new BoxContainer { Name = "Row" };'),
              ('        RefreshHud(presentation);', '        RefreshHud(presentation);\n        RefreshHudLayout();'),
              ('        return $"Interact {interact}   •   Management', '        if (GetViewport().GetVisibleRect().Size.X < 900) return $"Interact {interact}   •   Help {help}";\n        return $"Interact {interact}   •   Management'),
          ])
          helper = pathlib.Path('.github/workflows/apply-compact-hud-patch.yml')
          helper.unlink()
          changed.append(str(helper))
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *changed], check=True)
      - name: Commit exact paths without force and remove the helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): fit world HUD and scrollable help to readable small-window canvas'
          git push origin HEAD:refs/heads/playability/ranch-quiet-corner-20260910
