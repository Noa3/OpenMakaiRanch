name: Apply reviewed single-owner UI scale patch
on:
  push:
    branches: ['playability/ranch-quiet-corner-20260910']
    paths: ['.github/workflows/apply-ui-scale-patch.yml']
jobs:
  apply:
    if: github.ref == 'refs/heads/playability/ranch-quiet-corner-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Patch unchanged source only
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          changed = []
          def patch(name, expected, edits):
              p = pathlib.Path(name)
              raw = p.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if sha != expected:
                  raise RuntimeError('Concurrent source change: ' + name)
              text = raw.decode('utf-8')
              for old, new in edits:
                  if text.count(old) != 1:
                      raise RuntimeError('Expected one exact source anchor: ' + name)
                  text = text.replace(old, new, 1)
              p.write_bytes(text.encode('utf-8'))
              changed.append(name)
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.Screens.cs', 'eb657721b7a33701db7b43e9e054b3705ded8c30', [
              ('        scaleUpBtn.Pressed += () =>\n        {\n            var newScale = Mathf.Min(2.0f, settings.UiScale + 0.1f);\n            _game.SetUiScale(newScale);\n            _rootPanel.Scale = Vector2.One * newScale;\n            _game.NotifyStateChanged();\n            _game.Feedback.PlayConfirm();\n            ShowScreen("options");\n        };',
               '        // RuntimeSettings owns viewport scaling; scaling this panel as well applies it twice.\n        scaleUpBtn.Pressed += () => ExecuteUiAction(\n            () => _game.SetUiScale(_game.State.Settings.UiScale + 0.1f), true);'),
              ('        scaleDownBtn.Pressed += () =>\n        {\n            var newScale2 = Mathf.Max(0.5f, settings.UiScale - 0.1f);\n            _game.SetUiScale(newScale2);\n            _rootPanel.Scale = Vector2.One * newScale2;\n            _game.NotifyStateChanged();\n            _game.Feedback.PlayConfirm();\n            ShowScreen("options");\n        };',
               '        scaleDownBtn.Pressed += () => ExecuteUiAction(\n            () => _game.SetUiScale(_game.State.Settings.UiScale - 0.1f), true);'),
          ])
          patch('OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.cs', '69b9bc91777fa8fa8ce82ca5a0d3c6f022ad84ae', [
              ('            await CheckWorldLayouts(world);', '            await CheckWorldLayouts(world);\n            await CheckScaleButtons(world);'),
          ])
          helper = pathlib.Path('.github/workflows/apply-ui-scale-patch.yml')
          helper.unlink()
          changed.append(str(helper))
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *changed], check=True)
      - name: Commit only reviewed paths and remove the helper without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): apply options scale through the single runtime settings authority'
          git push origin HEAD:refs/heads/playability/ranch-quiet-corner-20260910
