name: Apply reviewed playability patch

on:
  push:
    branches: [ 'playability/csharp12-controls-20260910' ]
    paths: [ '.github/workflows/apply-playability-patch.yml' ]

jobs:
  apply-reviewed-patch:
    if: github.ref == 'refs/heads/playability/csharp12-controls-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Wire frame tests only at the existing smoke entry point
        shell: python
        run: |
          import hashlib
          import pathlib
          import subprocess
          path = pathlib.Path('OpenMakaiRanchGame/src/App/GameRoot.cs')
          raw = path.read_bytes()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert blob == '22f8cf380dee8fa754555e9bc530a3b9a6a55f4d', 'GameRoot changed; review rather than overwrite'
          old = ('\tprivate void RunSmokeTestsAndExit()\n\t{\n'
                 '\t\tvar result = SmokeTestRunner.Run();\n'
                 '\t\tforeach (var line in result.Lines)\n\t\t{\n'
                 '\t\t\tGD.Print(line);\n\t\t}\n\n'
                 '\t\tGetTree().Quit(result.Passed ? 0 : 1);\n\t}')
          new = ('\tprivate async void RunSmokeTestsAndExit()\n\t{\n'
                 '\t\tvar result = SmokeTestRunner.Run();\n'
                 '\t\t// Keep every assertion and failure; emit one terminal result after both suites.\n'
                 '\t\tresult.Lines.RemoveAll(line => line is "SMOKE PASS" or "SMOKE FAIL");\n'
                 '\t\ttry\n\t\t{\n'
                 '\t\t\tawait PlayabilityFrameTests.Run(this, result);\n\t\t}\n'
                 '\t\tcatch (Exception exception)\n\t\t{\n'
                 '\t\t\tresult.Passed = false;\n'
                 '\t\t\tresult.Lines.Add($"SMOKE FAIL frame test harness: {exception.Message}");\n\t\t}\n'
                 '\t\tresult.Lines.Add(result.Passed ? "SMOKE PASS" : "SMOKE FAIL");\n'
                 '\t\tforeach (var line in result.Lines)\n\t\t{\n'
                 '\t\t\tGD.Print(line);\n\t\t}\n\n'
                 '\t\tGetTree().Quit(result.Passed ? 0 : 1);\n\t}')
          text = raw.decode('utf-8')
          assert text.count(old) == 1, 'Expected exactly one unchanged smoke entry point'
          path.write_bytes(text.replace(old, new, 1).encode('utf-8'))
          subprocess.run(['git', 'diff', '--check'], check=True)
          evidence = pathlib.Path('.artifacts/reviewed-patch')
          evidence.mkdir(parents=True, exist_ok=True)
          evidence.joinpath('frame-entry.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', str(path)]))
      - name: Commit only the smoke entry point without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- OpenMakaiRanchGame/src/App/GameRoot.cs
          git commit -m 'test: await frame playthrough before reporting the final smoke result'
          git push origin HEAD:refs/heads/playability/csharp12-controls-20260910
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-frame-entry-patch
          path: .artifacts/reviewed-patch/
          if-no-files-found: error
