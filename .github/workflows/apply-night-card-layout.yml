name: Apply reviewed nightly-card layout
on:
  push:
    branches: ['fix/daily-gameplay-loop-20260911']
    paths: ['.github/workflows/apply-night-card-layout.yml']
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/daily-gameplay-loop-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Use existing vertical card content instead of overlapping panel children
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          changed=[]
          def patch(name, expected, edits):
              p=pathlib.Path(name)
              raw=p.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if sha != expected: raise RuntimeError('Concurrent source change: '+name)
              text=raw.decode('utf-8')
              for old,new,count in edits:
                  if text.count(old)!=count: raise RuntimeError('Source anchor count mismatch: '+name+' '+repr(old[:80]))
                  text=text.replace(old,new)
              p.write_bytes(text.encode('utf-8'))
              changed.append(name)
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.NightPlanning.cs','32f8ae0b51eca7f8ec884e8b6009ba599f3660ce',[
              ('        banner.AddThemeConstantOverride("separation", 6);\n        _content.AddChild(banner);',
               '        _content.AddChild(banner);\n        var inner = CardContent();\n        inner.Name = "NightPlanningContent";\n        banner.AddChild(inner);',1),
              ('banner.AddChild(AddStyledLine(', 'inner.AddChild(AddStyledLine(',1),
              ('banner.AddChild(MutedLabel(', 'inner.AddChild(MutedLabel(',3),
              ('banner.AddChild(button);', 'inner.AddChild(button);',1)])
          patch('OpenMakaiRanchGame/src/Ui/UiShellController.cs','5e248c7be67f1b928457ab76ec2942679f738143',[
              ('\t\t\trecovery.AddThemeConstantOverride("separation", 6);\n\t\t\t_content.AddChild(recovery);',
               '\t\t\trecovery.Name = "PlayerRecoveryCard";\n\t\t\t_content.AddChild(recovery);\n\t\t\tvar recoveryInner = CardContent();\n\t\t\trecovery.AddChild(recoveryInner);',1),
              ('recovery.AddChild(AddStyledLine(', 'recoveryInner.AddChild(AddStyledLine(',1),
              ('\t\t\tbath.Disabled = _game.State.Player.BathedToday;', '\t\t\tbath.Name = "PlayerBathAction";\n\t\t\tbath.Disabled = _game.State.Player.BathedToday;',1),
              ('\t\t\t\tSetStatus(result.Message, result.Used);', '\t\t\t\tSetStatus(result.Message, !result.Used);',1),
              ('\t\t\trecovery.AddChild(bath);','\t\t\trecoveryInner.AddChild(bath);',1)])
          patch('OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.Night.cs','ea2016919a87f2f603970d27235f04ac71d4865f',[
              ('        foreach (var choice in new[] { "rest", "train", "admin", "rest" })',
               '        var initialChoices = Descendants(shell).OfType<Button>()\n            .Where(b => b.Name.ToString().StartsWith("NightChoice_")).ToArray();\n'
               '        Check(initialChoices.Length == 3 && initialChoices[0].GetGlobalRect().End.Y <= initialChoices[1].GlobalPosition.Y\n'
               '            && initialChoices[1].GetGlobalRect().End.Y <= initialChoices[2].GlobalPosition.Y,\n'
               '            "nightly choices have separate non-overlapping hit targets, not stacked panel children");\n'
               '        foreach (var choice in new[] { "rest", "train", "admin", "rest" })',1),
              ('        var bath = game.UsePlayerBath();\n        Check(bath.Used && bath.UsedCleanBath && game.State.Calendar.NightAction == "train",',
               '        var bathButton = Descendants(shell).OfType<Button>().Single(b => b.Name == "PlayerBathAction");\n'
               '        await FocusClick(bathButton);\n'
               '        Check(game.State.Player.BathedToday\n'
               '            && game.State.Player.NextDayStaminaBonus == PlayerStaminaService.HotBathNextDayBonus\n'
               '            && game.State.Calendar.NightAction == "train",',1)])
          helper=pathlib.Path('.github/workflows/apply-night-card-layout.yml');helper.unlink();changed.append(str(helper))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*changed],check=True)
      - name: Commit exact paths and remove helper without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): keep nightly choices and bath text out of overlapping panel children'
          git push origin HEAD:refs/heads/fix/daily-gameplay-loop-20260911
