name: Wire reviewed quiet-corner slice
on:
  push:
    branches: [ 'playability/ranch-quiet-corner-20260910' ]
    paths: [ '.github/workflows/quiet-corner-wiring.yml' ]
jobs:
  wire:
    if: github.ref == 'refs/heads/playability/ranch-quiet-corner-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed exact replacements and refuse changed source
        shell: python
        run: |
          import hashlib
          import pathlib
          import subprocess
          changed = []
          def patch(name, expected, edits):
              path = pathlib.Path(name)
              raw = path.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              assert actual == expected, 'Changed source requires review: ' + name
              text = raw.decode('utf-8')
              for old, new in edits:
                  assert text.count(old) == 1, 'Non-unique or missing anchor in ' + name + ': ' + old[:100]
                  text = text.replace(old, new, 1)
              path.write_bytes(text.encode('utf-8'))
              changed.append(name)
          patch('OpenMakaiRanchGame/src/World/RanchGreyboxController.cs', 'c2c6df2667c9ac30869085697a40bfd5eebddedb', [
              ('station.AvailabilityResolver = () => ResolveStationAvailability(station);',
               'station.AvailabilityResolver ??= () => ResolveStationAvailability(station);'),
              ('        if (string.IsNullOrWhiteSpace(characterId))\n        {\n            SetFeedback("No roster worker is available.");',
               '        if (_nearbyStation.RequiresWorker && string.IsNullOrWhiteSpace(characterId))\n        {\n            SetFeedback("No roster worker is available.");'),
              ('            SetFeedback($"{_nearbyStation.Label}: {worker} updated.");\n'
               '            StationInteractionSucceeded?.Invoke(characterId, _nearbyStation.CommandTargetId);',
               '            SetFeedback(_nearbyStation.RequiresWorker\n'
               '                ? $"{_nearbyStation.Label}: {worker} updated."\n'
               '                : _nearbyStation.SuccessFeedback);\n'
               '            if (_nearbyStation.RequiresWorker)\n'
               '                StationInteractionSucceeded?.Invoke(characterId, _nearbyStation.CommandTargetId);')])
          patch('OpenMakaiRanchGame/src/World/PauseMenuController.cs', '746e3c5683965b91c3a2bdb38bf5d00d892e34e6', [
              ('    public void Close()\n    {\n        _communityBoard?.Close();',
               '    public void Close()\n    {\n        _ranchCorner?.Close();\n        _communityBoard?.Close();'),
              ('if (Visible && !IsCommunityBoardOpen && _resumeButton is not null',
               'if (Visible && !IsCommunityBoardOpen && !IsRanchCornerOpen && _resumeButton is not null')])
          patch('OpenMakaiRanchGame/scenes/WorldGame.tscn', '5102c1578fade915b743e3a6844c6d9f854f4c2f', [
              ('[gd_scene load_steps=11 format=3]', '[gd_scene load_steps=12 format=3]'),
              ('[node name="WorldGame" type="Node"]',
               '[ext_resource type="Script" path="res://src/World/RanchLeisureController.cs" id="11_leisure"]\n\n[node name="WorldGame" type="Node"]'),
              ('[node name="TownWorld" parent="." instance=ExtResource("4_town")]',
               '[node name="Leisure" type="Node3D" parent="RanchWorld"]\nscript = ExtResource("11_leisure")\n\n[node name="TownWorld" parent="." instance=ExtResource("4_town")]')])
          patch('OpenMakaiRanchGame/src/Tests/SmokeTestRunner.cs', 'c21c6f92ec8adcbe2dfe4dfcf8a501695bbe0c2f', [
              ('            PlayabilityRegressionTests.Run(result);',
               '            PlayabilityRegressionTests.Run(result);\n            RanchLeisureRegressionTests.Run(result);')])
          patch('OpenMakaiRanchGame/src/Tests/PlayabilityFrameTests.cs', '1611c36a0733ad4cebdd5399c1947b4f52a35bb6', [
              ('                "story, day, stock, gold and one-per-day receipt survive load together");',
               '                "story, day, stock, gold and one-per-day receipt survive load together");\n'
               '            await RanchLeisureFrameTests.Run(game, world, result);')])
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          subprocess.run(['git', 'diff', '--', *changed], check=True)
          subprocess.run(['git', 'add', '--', *changed], check=True)
      - name: Commit only reviewed paths without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire optional ranch points into existing controls and regression suites'
          git push origin HEAD:refs/heads/playability/ranch-quiet-corner-20260910
