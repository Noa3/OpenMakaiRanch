name: Apply reviewed input cleanup
on:
  push:
    branches: [feature/world-stations-and-interiors-20260911]
    paths: [.github/workflows/apply-input-cleanup.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/world-stations-and-interiors-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-stations-and-interiors-20260911
      - name: Apply only the reviewed fixture cleanup and remove this helper
        run: |
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          branch = 'feature/world-stations-and-interiors-20260911'
          if subprocess.check_output(['git','branch','--show-current'],text=True).strip() != branch: raise SystemExit('Wrong branch')
          path = Path('OpenMakaiRanchGame/src/Tests/UiLayoutAcceptance.Localization.cs')
          raw = path.read_bytes()
          if hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() != 'e98e5a0abcbeac7a6b244bbcf46fcb41d2d52125': raise SystemExit('Source changed')
          text = raw.decode('utf-8')
          old = '            Input.ReleasePressedEvents();\n'
          if text.count(old)!=1: raise SystemExit('Unexpected cleanup anchor')
          path.write_text(text.replace(old,''), encoding='utf-8')
          helper = '.github/workflows/apply-input-cleanup.yml'
          Path(helper).unlink()
          subprocess.run(['git','add','--',str(path),helper],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','test(ui): keep explicit paired key releases without an unavailable API'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          PY
