name: UI review source snapshot
on:
  push:
    branches: ['playability/ranch-quiet-corner-20260910']
    paths: ['.github/workflows/ui-review-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture tracked source only
        run: |
          mkdir evidence
          git rev-parse HEAD > evidence/head.txt
          git ls-tree -r HEAD > evidence/tree.txt
          git archive --format=zip --output=evidence/source.zip HEAD AGENTS.md Directory.Build.props Directory.Build.targets global.json .github/workflows Tools/Godot OpenMakaiRanchGame/src OpenMakaiRanchGame/scenes OpenMakaiRanchGame/data OpenMakaiRanchGame/docs OpenMakaiRanchGame/project.godot OpenMakaiRanchGame/OpenMakaiRanchGame.csproj OpenMakaiRanchGame/OpenMakaiRanch.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: ui-review-source
          path: evidence/
          retention-days: 3
