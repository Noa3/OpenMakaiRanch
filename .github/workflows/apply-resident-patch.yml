name: Apply reviewed resident interaction continuation
on:
  push:
    branches: [feature/world-stations-and-interiors-20260911]
    paths: [Tools/Godot/apply_resident_patch.py, 'Tools/Godot/resident_patch_part*.txt', .github/workflows/apply-resident-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/world-stations-and-interiors-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-stations-and-interiors-20260911
      - name: Apply exact reviewed source and remove temporary helpers
        run: |
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python Tools/Godot/apply_resident_patch.py
