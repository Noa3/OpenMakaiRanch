name: Apply reviewed station refinement
on:
  push:
    branches: [feature/world-stations-and-interiors-20260911]
    paths: [Tools/Godot/apply_station_refinement.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/world-stations-and-interiors-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-stations-and-interiors-20260911
      - run: |
          git config user.name 'OpenMakaiRanch maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python Tools/Godot/apply_station_refinement.py
